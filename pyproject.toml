[project]
name = "personal-blog"
version = "0.1.0"
description = "Personal blog built with FastAPI, backed by a filesystem article store."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Caio Carvalho", email = "caiocarvalho.py@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
personal-blog = "personal_blog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["personal_blog"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "pragma: no cover",
]
