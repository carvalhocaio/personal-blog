[project]
name = "personal-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caio Carvalho", email = "caiocarvalho.py@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "markupsafe>=3.0.3",
]

[project.scripts]
personal-blog = "personal_blog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
