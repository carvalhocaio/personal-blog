{% extends "base.html" %}

{% block page_title %}{{ form.heading }} · {{ site_title }}{% endblock %}

{% block content %}
<div class="card">
  <h1>{{ form.heading }}</h1>
  {% if form.errors %}
  <ul class="form-errors">
    {% for error in form.errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  <form method="post" action="{{ form.action }}" class="stacked-form">
    <label for="title">Article Title</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" required>

    <label for="published_at">Publishing Date</label>
    <input type="date" id="published_at" name="published_at" value="{{ form.published_at }}" required>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="16" required>{{ form.content }}</textarea>

    <button type="submit" class="button">{{ form.submit_label }}</button>
  </form>
</div>
{% endblock %}
