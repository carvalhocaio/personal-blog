{% extends "base.html" %}

{% block content %}
<div class="card">
  <h1>{{ site_title }}</h1>
  {% if not articles %}
  <p class="empty-state">No articles published yet.</p>
  {% else %}
  <ul class="article-list">
    {% for article in articles %}
    <li class="article-list-item">
      <a class="article-title" href="/articles/{{ article.slug }}">{{ article.title }}</a>
      <span class="article-date">{{ article.published_at | format_date }}</span>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
